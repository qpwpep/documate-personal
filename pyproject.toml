[project]
name = "DocuMate"
version = "0.2.0"
description = "DocuMate: a LangGraph-based learning assistant combining official-doc search, session upload retrieval, and chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.15",
    "fastapi>=0.120.1",
    "jsonschema>=4.26.0",
    "kiwipiepy>=0.24.1",
    "langchain-chroma>=1.0.0",
    "langchain-openai>=1.0.1",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.0.1",
    "markdown-it-py>=4.0.0",
    "nbformat>=5.10.4",
    "openai>=3.35.1",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.26",
    "requests>=2.32.5",
    "slack-sdk>=3.37.0",
    "streamlit>=1.54.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
docling = [
    "docling[easyocr,rapidocr]==2.126.0",
    # Docling 2.126.0 uses resolver symbols removed in RapidOCR 3.10.
    "rapidocr==3.9.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=9.0.2",
]
